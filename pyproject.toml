[project]
name = "transcriber"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av<19",  # av 19 dropped an open() arg faster-whisper 1.2.1 still passes
    "fastapi>=0.143.0",
    "faster-whisper>=1.2.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
